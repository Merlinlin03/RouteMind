[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "routemind"
version = "0.1.0"
description = "Multilingual feedback understanding and evidence extraction for OpsPilot and GrowthTriage"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "httpx>=0.27,<1", "jsonschema>=4.23,<5"
]

[project.optional-dependencies]
train = [
  "torch>=2.6,<3", "transformers==4.57.6", "peft==0.18.1",
  "accelerate==1.12.0", "bitsandbytes==0.49.1", "safetensors>=0.5,<1"
]
test = ["pytest>=8,<9"]

[project.scripts]
routemind = "routemind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
